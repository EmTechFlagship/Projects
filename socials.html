        /* Apply saved settings before CSS renders to prevent light/dark flash */
        (function () {
            var s = {};
            try { s = JSON.parse(localStorage.getItem('emapple.settings')) || {}; } catch (e) { s = {}; }
            var t = s.theme || 'auto';
            if (t === 'light' || t === 'dark') {
                document.documentElement.setAttribute('data-theme', t);
            } else {
                document.documentElement.setAttribute('data-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            }
            if (s.textSize) {
                var m = { small: 85, normal: 100, large: 120 };
                var ts = typeof s.textSize === 'number' ? s.textSize : (m[s.textSize] || 100);
                document.documentElement.style.fontSize = (16 * ts / 100) + 'px';
            }
            if (s.accent) document.documentElement.setAttribute('data-accent', s.accent);
        })();
    </script>
