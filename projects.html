<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <script>
        /* Apply theme before CSS renders to prevent light/dark flash */
        document.documentElement.setAttribute('data-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <link rel="stylesheet" href="design.css">
    <script src="theme.js" defer></script>
</head>
<body>
    <nav class="topbar">
        <a href="main.html">
            <span class="material-symbols-rounded nav-icon" aria-hidden="true">home</span>
            Home
        </a>
        <a href="projects.html" class="active">
            <span class="material-symbols-rounded nav-icon" aria-hidden="true">view_list</span>
            Projects
        </a>
        <a href="socials.html">
            <span class="material-symbols-rounded nav-icon" aria-hidden="true">groups</span>
            Socials
        </a>
    </nav>
    <main class="content">
        <p class="eyebrow">Selected work / open source</p>
        <h1 class="page-title">Things I've<br>built.</h1>
        <p class="hero-subtitle">A living archive of tools and experiments made for Apple platforms and curious people.</p>
        <div class="filters" id="filters">
            <span class="filter-slider" id="filterSlider"></span>
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="archived">Archived</button>
            <button type="button" class="filter-btn" data-filter="disabled">Disabled</button>
            <button type="button" class="filter-btn" data-filter="unavailable">Unavailable</button>
        </div>
        <section class="projects" id="projects"></section>
    </main>
    <script src="projects.js" defer></script>
</body>
</html>
